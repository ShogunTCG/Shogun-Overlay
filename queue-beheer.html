<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shogun TCG — Wachtrij Beheer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050816; color: white; font-family: 'Inter', sans-serif; padding: 20px; min-height: 100vh; }
  h1 { font-size: 18px; font-weight: 900; color: #e11d48; letter-spacing: 2px; margin-bottom: 4px; }
  .subtitle { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px; }
  .queue-list { display: flex; flex-direction: column; gap: 12px; }
  .queue-item { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; }
  .queue-item.live { border-color: rgba(225,29,72,0.5); background: rgba(225,29,72,0.06); }
  .item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .item-name { font-size: 15px; font-weight: 800; }
  .item-badge { font-size: 9px; font-weight: 900; letter-spacing: 2px; padding: 3px 8px; border-radius: 4px; }
  .badge-live { background: #e11d48; color: white; }
  .badge-waiting { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
  .item-order-num { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 2px; margin-bottom: 8px; }
  .item-products { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  .item-product-line { font-size: 13px; color: rgba(255,255,255,0.6); }
  .item-product-line span { color: white; font-weight: 700; }
  .item-total { font-size: 14px; font-weight: 700; color: #0ea5e9; margin-bottom: 12px; }
  .btn-row { display: flex; gap: 8px; }
  .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; }
  .btn-live { background: #e11d48; color: white; }
  .btn-done { background: rgba(14,165,233,0.15); border: 1px solid rgba(14,165,233,0.3); color: #0ea5e9; }
  .btn-remove { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); }
  .empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.2); font-size: 14px; }
  .refresh-btn { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 700; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
  .status-bar { font-size: 10px; color: rgba(255,255,255,0.2); text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<h1>SHOGUN TCG</h1>
<div class="subtitle">Wachtrij Beheer</div>

<button class="refresh-btn" onclick="loadQueue()">↻ Vernieuwen</button>

<div class="queue-list" id="queue-list">
  <div class="empty">Laden...</div>
</div>

<div class="status-bar" id="status-bar">Laatst bijgewerkt: —</div>

<script>
  const API = '/.netlify/functions/queue';

  async function loadQueue() {
    try {
      const res = await fetch(API);
      const data = await res.json();
      renderQueue(data.queue || []);
      document.getElementById('status-bar').textContent = 'Laatst bijgewerkt: ' + new Date().toLocaleTimeString('nl-NL');
    } catch(e) {
      document.getElementById('queue-list').innerHTML = '<div class="empty">Fout bij laden...</div>';
    }
  }

  async function updateStatus(id, status) {
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, status })
      });
      const data = await res.json();
      renderQueue(data.queue || []);
      document.getElementById('status-bar').textContent = 'Bijgewerkt: ' + new Date().toLocaleTimeString('nl-NL');
    } catch(e) {
      alert('Fout bij bijwerken');
    }
  }

  function renderQueue(queue) {
    const list = document.getElementById('queue-list');
    if (!queue.length) {
      list.innerHTML = '<div class="empty">Geen bestellingen in de wachtrij</div>';
      return;
    }

    list.innerHTML = queue.map((item, i) => {
      const isLive = item.status === 'live';

      // Order number
      const orderNumHtml = item.orderNumber 
        ? '<div class="item-order-num">BESTELLING #' + item.orderNumber + '</div>'
        : '';

      // Products list
      let productsHtml = '';
      if (item.items && item.items.length > 0) {
        productsHtml = '<div class="item-products">' +
          item.items.map(p => 
            '<div class="item-product-line"><span>' + p.qty + 'x</span> ' + p.name + ' — ' + p.price + '</div>'
          ).join('') +
        '</div>';
      } else {
        productsHtml = '<div class="item-products"><div class="item-product-line">' + item.product + '</div></div>';
      }

      return '<div class="queue-item ' + item.status + '">' +
        '<div class="item-header">' +
          '<div class="item-name">' + item.name + '</div>' +
          '<div class="item-badge badge-' + item.status + '">' + (isLive ? '● LIVE' : '#' + (i+1)) + '</div>' +
        '</div>' +
        orderNumHtml +
        productsHtml +
        '<div class="item-total">Totaal: €' + parseFloat(item.total).toFixed(2) + '</div>' +
        '<div class="btn-row">' +
          (item.status === 'waiting' ? '<button class="btn btn-live" onclick="updateStatus(\'' + item.id + '\', \'live\')">▶ Live zetten</button>' : '') +
          (item.status === 'live' ? '<button class="btn btn-done" onclick="updateStatus(\'' + item.id + '\', \'done\')">✓ Afgerond</button>' : '') +
          '<button class="btn btn-remove" onclick="updateStatus(\'' + item.id + '\', \'done\')">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  loadQueue();
  setInterval(loadQueue, 10000);
</script>
</body>
</html>
