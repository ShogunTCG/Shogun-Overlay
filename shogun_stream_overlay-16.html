<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; }
  .sw { width: 100%; aspect-ratio: 16/9; overflow: hidden; position: relative; }
  .inner { width: 1920px; height: 1080px; transform-origin: top left; position: absolute; top: 0; left: 0; font-family: 'Inter', sans-serif; overflow: hidden; background: transparent; }


    25%  { transform: translateX(0%) scaleX(1.1); opacity: 1; }
    50%  { transform: translateX(30%) scaleX(0.9); opacity: 0.7; }
    75%  { transform: translateX(10%) scaleX(1.2); opacity: 1; }
    100% { transform: translateX(-30%) scaleX(0.8); opacity: 0.6; }
  }
  .grid-bg { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(14,165,233,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(14,165,233,0.03) 1px, transparent 1px);
    background-size: 80px 80px; }

  /* ── LOGO linksboven ── */
  .logo-corner { position: absolute; top: 40px; left: 40px; z-index: 10; }
  .logo-sword { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; filter: drop-shadow(0 0 14px rgba(225,29,72,0.9)); }

  /* ── RIGHT PANEL ── */
  .right-panel { z-index: 2;
    position: absolute; right: 0; top: 0; bottom: 0; width: 480px;
    background: transparent;
    border-left: 1px solid rgba(225,29,72,0.2);
    display: flex; flex-direction: column;
  }

  /* FACECAM 16:9 = 480x270 transparant */
  .facecam {
    width: 480px; height: 270px; flex-shrink: 0;
    background: transparent;
    border-bottom: 1px solid rgba(225,29,72,0.15);
    position: relative;
  }
  .facecam-live {
    position: absolute; top: 40px; right: 40px; z-index: 10;
    background: #e11d48; color: white; font-size: 11px; font-weight: 900;
    letter-spacing: 3px; padding: 5px 12px; border-radius: 4px;
    animation: livepulse 2s ease-in-out infinite;
  }
  @keyframes livepulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

  /* PANEL CONTENT */
  .panel-content { background: rgba(5,8,22,0.97); flex: 1; display: flex; flex-direction: column; padding: 0; gap: 0; overflow: visible; }

  .section-label { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.25); letter-spacing: 5px; text-transform: uppercase; margin-bottom: 8px; flex-shrink: 0; }

  /* ── WACHTRIJ ── */
  .queue-section { display: flex; flex-direction: column; margin-bottom: 8px; flex-shrink: 1; padding: 24px 24px 0 0; }
  .queue-items { display: flex; flex-direction: column; gap: 8px; }
  .queue-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
  .queue-item.first { border-color: rgba(225,29,72,0.4); background: rgba(225,29,72,0.06); }
  .queue-item.first::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #e11d48; }
  .queue-item.second::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: rgba(255,255,255,0.25); }
  .queue-item.third::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: rgba(255,255,255,0.1); }
  .queue-num { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; flex-shrink: 0; }
  .queue-num.n1 { background: rgba(225,29,72,0.2); color: #e11d48; }
  .queue-num.n2 { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.45); }
  .queue-num.n3 { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.25); }
  .queue-info { flex: 1; min-width: 0; }
  .queue-name { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-item.first .queue-name { color: #ffffff; }
  .queue-item.second .queue-name { color: rgba(255,255,255,0.6); }
  .queue-item.third .queue-name { color: rgba(255,255,255,0.35); }
  .queue-product { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── DIVIDER ── */
  .divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(225,29,72,0.3), transparent); margin-bottom: 14px; flex-shrink: 0; }

  /* ── CARROUSEL ── */
  .carousel-section { flex: 1; display: flex; flex-direction: column; min-height: 280px; overflow: visible; padding: 8px 24px 24px 0; }
  .carousel-wrap {
    flex: 1; position: relative; overflow: hidden;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.07);
    background: #050816;
  }
  .carousel-slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px;
    transform: translateX(100%);
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .carousel-slide.active { transform: translateX(0%); }
  .carousel-slide.exit { transform: translateX(-100%); }
  .carousel-slide img {
    width: 100%; max-height: 65%; object-fit: contain;
    border-radius: 8px; margin-bottom: 12px;
  }
  .carousel-name { font-size: 13px; font-weight: 800; color: #ffffff; text-transform: uppercase; text-align: center; letter-spacing: 0.5px; margin-bottom: 6px; line-height: 1.3; }
  .carousel-row { display: flex; align-items: center; gap: 10px; }
  .carousel-price { font-size: 20px; font-weight: 900; color: #ffffff; }
  .carousel-badge { font-size: 9px; font-weight: 900; letter-spacing: 1px; padding: 4px 8px; border-radius: 3px; text-transform: uppercase; }
  .badge-hot { background: #f97316; color: white; }
  .badge-new { background: #0ea5e9; color: white; }
  .badge-sale { background: #e11d48; color: white; }

  /* Progress dots */
  .carousel-dots { display: flex; gap: 6px; margin-top: 8px; flex-shrink: 0; justify-content: center; }
  .carousel-dot { width: 24px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.15); transition: background 0.3s; }
  .carousel-dot.active { background: #e11d48; }

  .cta { background: rgba(14,165,233,0.07); border: 1px solid rgba(14,165,233,0.2); border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; margin: 8px 24px 24px 0; }
  .cta-text { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; }
  .cta-url { font-size: 15px; font-weight: 900; color: #0ea5e9; letter-spacing: 1px; text-transform: uppercase; }

  /* Progress bar */
  .progress-bar { height: 2px; background: rgba(255,255,255,0.06); border-radius: 0 0 10px 10px; flex-shrink: 0; overflow: hidden; }
  .progress-fill { height: 100%; background: #e11d48; width: 0%; transition: none; }

  /* ── CTA ── */

  .cta-text { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; }
  .cta-url { font-size: 15px; font-weight: 900; color: #0ea5e9; letter-spacing: 1px; text-transform: uppercase; }

 100% { transform: translateX(-50%); } }

  .bottom-bar { display: none; position: absolute; bottom: 58px; z-index: 10; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #e11d48, #0ea5e9, #e11d48); background-size: 200% 100%; animation: slide 3s linear infinite; z-index: 10; }
  @keyframes slide { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }

  #bg-canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 0; }
</style>

  // Canvas - draw dark background with transparent hole for webcam
  const bgCanvas = document.getElementById('bg-canvas');
  const bgCtx = bgCanvas.getContext('2d');

  function drawOverlayBg() {
    const W = 1920, H = 1080;
    // Facecam hole: right panel starts at x=1440, webcam is 480x270 at top
    const cx = 1440, cy = 24, cw = 456, ch = 243, cr = 12;

    // Clear
    bgCtx.clearRect(0, 0, W, H);

    // Draw full dark background
    bgCtx.fillStyle = '#050816';
    bgCtx.fillRect(0, 0, W, H);

    // Add glows
    const gr = bgCtx.createRadialGradient(-200, -300, 0, -200, -300, 800);
    gr.addColorStop(0, 'rgba(225,29,72,0.10)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = gr;
    bgCtx.fillRect(0, 0, W, H);

    const gb = bgCtx.createRadialGradient(W+100, H+200, 0, W+100, H+200, 700);
    gb.addColorStop(0, 'rgba(14,165,233,0.08)');
    gb.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = gb;
    bgCtx.fillRect(0, 0, W, H);

    // Cut out webcam hole with rounded corners
    bgCtx.globalCompositeOperation = 'destination-out';
    bgCtx.fillStyle = 'rgba(0,0,0,1)';
    bgCtx.beginPath();
    bgCtx.moveTo(cx + cr, cy);
    bgCtx.lineTo(cx + cw - cr, cy);
    bgCtx.quadraticCurveTo(cx + cw, cy, cx + cw, cy + cr);
    bgCtx.lineTo(cx + cw, cy + ch - cr);
    bgCtx.quadraticCurveTo(cx + cw, cy + ch, cx + cw - cr, cy + ch);
    bgCtx.lineTo(cx + cr, cy + ch);
    bgCtx.quadraticCurveTo(cx, cy + ch, cx, cy + ch - cr);
    bgCtx.lineTo(cx, cy + cr);
    bgCtx.quadraticCurveTo(cx, cy, cx + cr, cy);
    bgCtx.closePath();
    bgCtx.fill();
    bgCtx.globalCompositeOperation = 'source-over';

    // Cut out main camera area (left, iPhone/camera feed)
    const mx = 24, my = 24, mw = 1392, mh = 1032, mr = 16;
    bgCtx.globalCompositeOperation = 'destination-out';
    bgCtx.fillStyle = 'rgba(0,0,0,1)';
    bgCtx.beginPath();
    bgCtx.moveTo(mx + mr, my);
    bgCtx.lineTo(mx + mw - mr, my);
    bgCtx.quadraticCurveTo(mx + mw, my, mx + mw, my + mr);
    bgCtx.lineTo(mx + mw, my + mh - mr);
    bgCtx.quadraticCurveTo(mx + mw, my + mh, mx + mw - mr, my + mh);
    bgCtx.lineTo(mx + mr, my + mh);
    bgCtx.quadraticCurveTo(mx, my + mh, mx, my + mh - mr);
    bgCtx.lineTo(mx, my + mr);
    bgCtx.quadraticCurveTo(mx, my, mx + mr, my);
    bgCtx.closePath();
    bgCtx.fill();
    bgCtx.globalCompositeOperation = 'source-over';
  }

  const CDUR2 = 7000;
  const CQRDUR2 = 10000;
  let cur2 = 0, t02 = null, allSlides2 = [], allDots2 = [];
  let ticking2 = false;

  function goTo2(n) {
    if (allSlides2.length === 0) return;
    var prev = cur2;
    allSlides2[prev].style.transition = 'transform 0.4s ease-in, opacity 0.2s ease-in';
    allSlides2[prev].style.transform = 'translateX(-100%)';
    allSlides2[prev].style.opacity = '0';
    if(allDots2[prev]) allDots2[prev].classList.remove('active');
    setTimeout(function() {
      allSlides2[prev].classList.remove('active');
      allSlides2[prev].style.transition = 'none';
      allSlides2[prev].style.transform = 'translateX(100%)';
      allSlides2[prev].style.opacity = '0';
      cur2 = n;
      allSlides2[cur2].style.transition = 'none';
      allSlides2[cur2].style.transform = 'translateX(100%)';
      allSlides2[cur2].style.opacity = '0';
      allSlides2[cur2].classList.add('active');
      if(allDots2[cur2]) allDots2[cur2].classList.add('active');
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          allSlides2[cur2].style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
          allSlides2[cur2].style.transform = 'translateX(0)';
          allSlides2[cur2].style.opacity = '1';
        });
      });
      t02 = performance.now();
      var prog2 = document.getElementById('progress');
      if(prog2) {
        prog2.style.transition = 'none'; prog2.style.width = '100%';
        requestAnimationFrame(function() { requestAnimationFrame(function() {
          var d = (cur2 === allSlides2.length - 1) ? CQRDUR2 : CDUR2;
          prog2.style.transition = 'width ' + d + 'ms linear';
          prog2.style.width = '0%';
        }); });
      }
    }, 420);
  }

  function tick2(ts) {
    if (allSlides2.length > 0 && t02 !== null) {
      var dur = (cur2 === allSlides2.length - 1) ? CQRDUR2 : CDUR2;
      if (ts - t02 >= dur) goTo2((cur2 + 1) % allSlides2.length);
    }
    requestAnimationFrame(tick2);
  }

  // ── LIVE WACHTRIJ ──
  async function loadQueue() {
    try {
      const res = await fetch('https://shogun-overlay.netlify.app/.netlify/functions/queue');
      const data = await res.json();
      renderQueue(data.queue || []);
    } catch(e) { console.error('Queue error:', e); }
  }

  function renderQueue(queue) {
    const el = document.getElementById('queue-items');
    if (!el) return;
    const classes = ['first', 'second', 'third'];
    const nums = ['n1', 'n2', 'n3'];
    let html = '';
    for (let i = 0; i < 3; i++) {
      const item = queue[i];
      const cls = classes[i];
      if (item) {
        const isLive = item.status === 'live';
        const numEl = isLive
          ? '<div class="queue-num n1" style="background:rgba(225,29,72,0.25);color:#e11d48;font-size:9px;letter-spacing:1px;font-weight:900;width:40px;">LIVE</div>'
          : '<div class="queue-num ' + nums[i] + '">' + (i+1) + '</div>';
        html += '<div class="queue-item ' + cls + '">' +
          numEl +
          '<div class="queue-info">' +
            '<div class="queue-name">' + item.name + '</div>' +
            '<div class="queue-product">' + (isLive ? '● Nu live: ' : '') + item.product + '</div>' +
          '</div>' +
        '</div>';
      } else {
        html += '<div class="queue-item ' + cls + '" style="opacity:0.2;">' +
          '<div class="queue-num ' + nums[i] + '">' + (i+1) + '</div>' +
          '<div class="queue-info">' +
            '<div class="queue-name">—</div>' +
            '<div class="queue-product">Wachten op bestelling</div>' +
          '</div>' +
        '</div>';
      }
    }
    el.innerHTML = html;
  }

  loadQueue();
  setInterval(loadQueue, 5000);
