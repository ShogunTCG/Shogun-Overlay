<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .sw { width: 100%; aspect-ratio: 16/9; overflow: hidden; position: relative; }
  .inner { width: 1920px; height: 1080px; transform-origin: top left; position: absolute; top: 0; left: 0; background: #050816; font-family: 'Inter', sans-serif; overflow: hidden; }

  /* Animated background grid */
  .bg-grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(14,165,233,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(14,165,233,0.035) 1px, transparent 1px);
    background-size: 80px 80px;
    animation: gridshift 30s linear infinite;
  }
  @keyframes gridshift { 0% { background-position: 0 0; } 100% { background-position: 80px 80px; } }

  /* Glows */
  .glow-red { position: absolute; width: 1000px; height: 1000px; border-radius: 50%;
    background: radial-gradient(circle, rgba(225,29,72,0.12) 0%, transparent 65%);
    top: -400px; left: -300px; animation: glowr 12s ease-in-out infinite; }
  .glow-blue { position: absolute; width: 800px; height: 800px; border-radius: 50%;
    background: radial-gradient(circle, rgba(14,165,233,0.10) 0%, transparent 65%);
    bottom: -300px; right: -100px; animation: glowb 10s ease-in-out infinite; }
  .glow-red2 { position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(225,29,72,0.07) 0%, transparent 65%);
    bottom: 100px; left: 200px; animation: glowr 15s ease-in-out infinite reverse; }
  @keyframes glowr { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px, 60px); } }
  @keyframes glowb { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px, -40px); } }

  /* Left side — big BRB text watermark */
  .watermark { position: absolute; left: -20px; top: 50%; transform: translateY(-50%);
    font-size: 320px; font-weight: 900; color: rgba(225,29,72,0.04);
    letter-spacing: -10px; line-height: 1; user-select: none; white-space: nowrap;
    animation: fadebreath 6s ease-in-out infinite;
  }
  @keyframes fadebreath { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* Layout: left content + right logo */
  .layout { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 140px; }

  /* Left: text content */
  .left { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; flex: 1; }
  .brb-eyebrow { font-size: 15px; font-weight: 500; color: rgba(14,165,233,0.8); letter-spacing: 10px; text-transform: uppercase; margin-bottom: 24px; }
  .brb-main { font-size: 88px; font-weight: 900; color: #ffffff; letter-spacing: -3px; line-height: 0.95; text-transform: uppercase; margin-bottom: 12px; }
  .brb-main span { color: #e11d48; }
  .brb-sub { font-size: 22px; font-weight: 400; color: rgba(255,255,255,0.3); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 56px; }

  /* Animated red line */
  .red-line { width: 0; height: 3px; background: linear-gradient(90deg, #e11d48, rgba(225,29,72,0)); border-radius: 2px; margin-bottom: 56px; animation: lineexpand 2s ease-out forwards; }
  @keyframes lineexpand { 0% { width: 0; } 100% { width: 380px; } }

  /* Socials left-aligned */
  .socials { display: flex; flex-direction: column; gap: 18px; }
  .social-item { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 16px; transition: color 0.3s; }
  .social-item svg { opacity: 0.8; }

  /* Right: logos stacked */
  .right { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-width: 620px; }

  /* Pulsing rings */
  .sword-wrap { position: relative; margin-bottom: 10px; animation: float 5s ease-in-out infinite; }
  .ring1 { position: absolute; inset: -20px; border-radius: 40px; border: 1.5px solid rgba(225,29,72,0.25); animation: ringpulse 2.5s ease-in-out infinite; }
  .ring2 { position: absolute; inset: -40px; border-radius: 52px; border: 1px solid rgba(225,29,72,0.10); animation: ringpulse 2.5s ease-in-out infinite 0.5s; }
  .ring3 { position: absolute; inset: -62px; border-radius: 64px; border: 1px solid rgba(225,29,72,0.05); animation: ringpulse 2.5s ease-in-out infinite 1s; }
  @keyframes ringpulse { 0%,100% { opacity: 0.3; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.03); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }

  .sword-logo { width: 100px; height: 100px; object-fit: cover; border-radius: 30px;
    filter: drop-shadow(0 0 50px rgba(225,29,72,0.9)) drop-shadow(0 0 120px rgba(225,29,72,0.35));
    display: block;
  }
  .text-logo { height: 80px; object-fit: contain; mix-blend-mode: screen; }

  /* Bottom bar */
  .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #e11d48, #0ea5e9, #e11d48);
    background-size: 200% 100%; animation: slide 3s linear infinite; }
  @keyframes slide { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }

  /* Vertical divider */
  .vdivider { position: absolute; left: 50%; top: 10%; bottom: 10%; width: 1px;
    background: linear-gradient(180deg, transparent, rgba(225,29,72,0.2), transparent);
  }

  /* ── CARROUSEL ── */
  .carousel-outer { width: 600px; margin-top: 0; }
  .carousel-header { font-size: 14px; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 5px; text-transform: uppercase; margin-bottom: 14px; text-align: center; }
  .carousel-wrap {
    width: 600px; height: 620px; position: relative; overflow: hidden;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.07);
    background: rgba(5,8,22,0.6);
  }
  .c-slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 20px;
    transform: translateX(100%);
    opacity: 0;
    transition: none;
  }
  .c-slide.active { transform: translateX(0); opacity: 1; }
  .c-slide.exit { transform: translateX(-100%); opacity: 1; transition: transform 0.5s ease-in; }
  .c-slide img {
    width: 65%; aspect-ratio: 1; object-fit: contain;
    border-radius: 8px; margin-bottom: 16px;
    mix-blend-mode: screen; flex-shrink: 0;
  }
  .c-slide img.qr { mix-blend-mode: normal; width: 70% !important; aspect-ratio: 1; margin-bottom: 20px; }
  .c-name { font-size: 18px; font-weight: 700; color: #fff; text-transform: uppercase; text-align: center; letter-spacing: 0.5px; margin-bottom: 10px; line-height: 1.3; }
  .c-row { display: flex; align-items: center; gap: 8px; }
  .c-price { font-size: 34px; font-weight: 900; color: #fff; }
  .c-badge { font-size: 18px; font-weight: 900; letter-spacing: 1px; padding: 0 16px; border-radius: 6px; text-transform: uppercase; height: 34px; display: inline-flex; align-items: center; }
  .c-badge.hot  { background: #f97316; color: white; }
  .c-badge.new  { background: #0ea5e9; color: white; }
  .c-badge.sale { background: #e11d48; color: white; }
  

  /* Progress bar */
  .c-progress { height: 2px; background: rgba(255,255,255,0.06); border-radius: 0 0 12px 12px; overflow: hidden; }
  .c-progress-fill { height: 100%; background: #e11d48; transform-origin: left; }

  /* Dots */
  .c-dots { display: flex; gap: 8px; margin-top: 12px; justify-content: center; padding: 4px 0; }
  .c-dot { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); transition: background 0.3s; }
  .c-dot.active { background: #e11d48; background: #e11d48; }
</style>

<script>
  const sw = document.querySelector('.sw');

  const CDUR = 7000;
  const CQRDUR = 10000;
  let cur = 0;
  let t0 = null;
  let allSlides = [];
  let allDots = [];
  let ticking = false;

  function goTo(n) {
    if (allSlides.length === 0) return;
    var prev = cur;
    var next = n;

    // Step 1: slide old one out
    allSlides[prev].style.transition = 'transform 0.45s ease-in, opacity 0.45s ease-in';
    allSlides[prev].style.transform = 'translateX(-100%)';
    allSlides[prev].style.opacity = '0';
    if(allDots[prev]) allDots[prev].classList.remove('active');

    // Step 2: after old is gone, bring in new
    setTimeout(function() {
      allSlides[prev].classList.remove('active');
      allSlides[prev].style.transition = 'none';
      allSlides[prev].style.transform = 'translateX(100%)';
      allSlides[prev].style.opacity = '0';

      cur = next;
      allSlides[cur].style.transition = 'none';
      allSlides[cur].style.transform = 'translateX(100%)';
      allSlides[cur].style.opacity = '0';
      allSlides[cur].classList.add('active');
      if(allDots[cur]) allDots[cur].classList.add('active');

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          allSlides[cur].style.transition = 'transform 0.45s ease-out, opacity 0.45s ease-out';
          allSlides[cur].style.transform = 'translateX(0)';
          allSlides[cur].style.opacity = '1';
        });
      });

      t0 = performance.now();
      var prog = document.getElementById('c-progress');
      if(prog) {
        prog.style.transition = 'none';
        prog.style.transform = 'scaleX(1)';
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            var d = (cur === allSlides.length - 1) ? CQRDUR : CDUR;
            prog.style.transition = 'transform ' + d + 'ms linear';
            prog.style.transform = 'scaleX(0)';
          });
        });
      }
    }, 480);
  }

  function tick(ts) {
    if (allSlides.length > 0 && t0 !== null) {
      var dur = (cur === allSlides.length - 1) ? CQRDUR : CDUR;
      if (ts - t0 >= dur) {
        goTo((cur + 1) % allSlides.length);
      }
    }
    requestAnimationFrame(tick);
  }

      wrap.appendChild(qrSlide);
